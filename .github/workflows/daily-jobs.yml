name: Run Daily Subscription Jobs

on:
  schedule:
    # Runs every day at 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  cron:
    name: Trigger Daily Cron API
    runs-on: ubuntu-latest
    steps:
      - name: Call House of Subscriptions Daily Jobs Endpoint
        run: |
          curl -s -X POST "${{ secrets.BACKEND_URL }}/api/jobs/run-daily" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET_KEY }}" \
            -H "Content-Type: application/json"
